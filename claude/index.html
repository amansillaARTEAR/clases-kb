<title>Clases Kick Boxing / Muay Thai</title>
<style>

*{box-sizing:border-box}
button,.btn,.pill,a{touch-action:manipulation}

#live button.tap{transform:scale(.9);filter:brightness(1.4)}
.dnd{display:flex;align-items:stretch;gap:4px;position:relative}.dnd>.ex{flex:1;min-width:0}
.hdl{display:flex;align-items:center;justify-content:center;width:16px;flex-shrink:0;color:var(--mut);font-size:16px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;border-radius:6px}
.hdl:hover{background:var(--card2);color:var(--fg)}
.dnd.drag{z-index:20;opacity:.92;box-shadow:0 8px 24px #0009}.dnd.drag .hdl{cursor:grabbing}
.dnd.tgt-a::before,.dnd.tgt-b::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--acc);border-radius:2px}.dnd.tgt-a::before{top:-3px}.dnd.tgt-b::after{bottom:-3px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0d0d0f;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:860px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:1}
.top h1 span{color:var(--acc)}
nav{display:flex;overflow-x:auto;scrollbar-width:none;max-width:860px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 12px;font:600 14px system-ui;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
select,input,textarea{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{width:100%;min-height:60px}
.btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.blk{margin-bottom:14px}
.blkh{display:flex;justify-content:space-between;align-items:baseline;border-left:4px solid var(--acc);padding-left:10px;margin:6px 0 8px}
.blkh h3{margin:0;font-size:16px}
.blkh small{color:var(--mut)}
.cfg{color:var(--acc2);font-size:13px;margin:0 0 8px 14px}
.ex{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:6px}
.ex svg{width:62px;height:62px;flex:none;background:#18181c;border-radius:8px}
.ex .info{flex:1;min-width:0}
.ex .nm{font-weight:600}
.ex .ds{font-size:12px;color:var(--mut)}
.vlink{font:600 11px system-ui;color:#ff8a8c;text-decoration:none;white-space:nowrap;margin-left:4px;border:1px solid #5a2a2c;border-radius:12px;padding:1px 7px;vertical-align:middle}
.chip{display:inline-block;font-size:11px;background:#333;border-radius:20px;padding:1px 8px;margin:2px 3px 0 0;color:#ddd}
.chip.rep{background:#5a3b00;color:var(--acc2)}
.mut{color:var(--mut)}
.note{font-size:13px;color:var(--mut);padding:6px 0}
.warn{background:#3a2a00;color:var(--acc2);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.hist .ex{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.tog{display:flex;align-items:center;gap:8px;background:var(--card2);padding:8px 10px;border-radius:8px}
.tog input{width:18px;height:18px;flex:none}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.mgrid .tog span{min-width:0;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;margin:0;padding:7px 12px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--fg);font-size:13px;cursor:pointer;user-select:none}
.pill input{position:absolute;opacity:0;width:0;height:0}
.pill:has(input:checked){background:var(--acc);border-color:var(--acc)}
.pill:has(input:checked)::before{content:'✓';font-weight:800}
.plist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.prow{display:flex;align-items:center;gap:10px;margin:0;padding:8px 10px;border-radius:8px;color:var(--fg);font-size:14px;cursor:pointer}
.prow input{width:18px!important;height:18px;flex:none;accent-color:var(--acc)}
.prow:has(input:checked){background:#3a1517}
.off .ex{border-left:3px solid #ff8c00}.off .ex>svg,.off .ex .info{opacity:.45}
.btn.bpause{border-color:#ff8c0099;color:#ffb35c}.btn.bact{background:#1f7a3f;border-color:#1f7a3f;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal .box{background:var(--card);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.modal svg.big{width:100%;max-width:260px;display:block;margin:0 auto 10px;background:#18181c;border-radius:12px}
.f{margin-bottom:10px}.f input,.f select{width:100%}
/* modo clase / timer */
#live{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#3a3a40;transition:background .35s;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));color:#fff;overflow:hidden}
#live.on{display:flex}
#live.big #lv-time{font-size:min(42vh,34vw);letter-spacing:-6px}#live.big #lv-name{font-size:min(8vh,6vw)}#live.big #lv-ph{font-size:min(6vh,5vw)}#live.big #lv-round,#live.big #lv-blk{font-size:min(4vh,3vw)}
#live.big .lc,#live.big #lv-cfg,#live.big #lv-tot{display:none}#live.big.ctl .lc{display:flex}#live.big #lv-svg{height:min(30vh,40vw)}
#live.work{background:radial-gradient(circle at 50% 30%,#1f9d55,#0d5a2f)}
#live.warn{background:radial-gradient(circle at 50% 30%,#ff8a00,#c24e00)}
#live.rest{background:radial-gradient(circle at 50% 30%,#d61f2c,#8e0d15)}
#live.prep{background:radial-gradient(circle at 50% 30%,#4a4a52,#1d1d22)}
#live.end{background:radial-gradient(circle at 50% 30%,#2b2b31,#0b0b0d)}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv-top .t{font:800 16px system-ui;letter-spacing:.5px;opacity:.95}
.lv-top .tot{font:600 13px system-ui;opacity:.85;font-variant-numeric:tabular-nums}
#lv-cfg{text-align:center;font:700 clamp(14px,4vw,20px) system-ui;opacity:.9;margin-top:4px}
#lv-ph{align-self:center;margin-top:auto;font:900 14px system-ui;letter-spacing:4px;padding:5px 16px;border-radius:30px;background:rgba(0,0,0,.25)}
#lv-time{font:900 clamp(96px,30vw,240px)/0.95 system-ui;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin-top:6px;text-shadow:0 6px 30px rgba(0,0,0,.25)}
#lv-round{text-align:center;font:800 clamp(26px,8vw,44px) system-ui;opacity:.92}
#lv-name{text-align:center;font:800 clamp(18px,5vw,28px) system-ui;margin:6px 8px 0;min-height:1.2em}
#lv-svg{flex:1;min-height:60px;width:100%;max-height:30vh}
.dndb{position:relative}.dndb.drag{z-index:20;opacity:.92;box-shadow:0 8px 24px #0009;background:var(--card)}.dndb.tgt-a::before,.dndb.tgt-b::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--acc);border-radius:2px}.dndb.tgt-a::before{top:-4px}.dndb.tgt-b::after{bottom:-4px}
button.renb{background:none;border:0;cursor:pointer;font-size:13px;opacity:.6;padding:2px}button.renb:hover{opacity:1}input.reni{font:inherit;font-size:16px;font-weight:700;padding:3px 6px;width:min(60vw,260px)}
#lv-par{display:grid;gap:8px;margin:6px 10px 0;flex:1;min-height:0;overflow:auto;align-content:start}#live.pares #lv-svg,#live.pares #lv-name,#live.pares #lv-next,#live.pares #lv-round,#live.pares #lv-est{display:none!important}#live.pares #lv-time{font-size:clamp(40px,12vw,72px)}
.pp{background:#0004;border:2px solid #fff3;border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}.pp.fin{background:#2a9d8f55;border-color:#2a9d8f}.pp-r{font:800 13px system-ui;opacity:.9;min-height:15px;color:#ffe066}.pp-n{font:900 clamp(16px,4.5vw,24px) system-ui;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pp-t{font:900 clamp(26px,8vw,44px) system-ui;font-variant-numeric:tabular-nums;line-height:1}.pp-a{font:600 11px system-ui;opacity:.75;min-height:13px}.pp-b{display:flex;gap:6px;justify-content:center;margin-top:4px}.pp-ok{flex:1;padding:10px 6px;font:800 15px system-ui;border-radius:10px;border:0;background:#fff;color:#14532d}.pp-un{padding:8px 10px;border-radius:10px;border:0;background:#0004;color:#fff;font-size:15px}.pp-h{font:600 11px system-ui;opacity:.85;min-height:13px}
.parl{margin:8px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.parr{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}.parr:first-child{border-top:0}.parn{color:#f4c430;font-size:12px;min-width:62px}.parr small{color:var(--mut);font-weight:600}.parr small.best{color:#f4c430}
.trans{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px;color:#f4a261;font-size:12px;font-weight:800}.trans::before,.trans::after{content:'';flex:1;border-top:2px dashed #f4a261aa}
.dstep{display:inline-flex;align-items:center;gap:2px;background:#3a1517;color:#ffb3b5;border-radius:999px;padding:1px 3px;font-size:12px;font-weight:700;vertical-align:middle;margin:3px 8px 3px 0}.dstep.mod{background:#4a3a10;color:#ffe066}.dstep button{border:0;background:none;color:#f4a261;font-size:15px;font-weight:900;width:22px;height:22px;cursor:pointer;line-height:1}.dstep span{padding:0 2px;font-variant-numeric:tabular-nums}
.sugbox{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4a26122;border:1px solid #f4a261;color:#ffd9b8;font-size:13px}.sugbox b{color:#fff}
.agth svg{width:100%;height:100%;display:block}
button.delb{font-size:11px;padding:3px 8px;color:#ff6b6b;border-color:#e5383b66}button.delb.sure{background:#e5383b;color:#fff;border-color:#e5383b}

#lv-bar{height:8px;background:rgba(0,0,0,.25);margin:auto 4px 10px;border-radius:6px;overflow:hidden}
#lv-bar div{height:100%;background:#fff;width:0;transition:width .2s linear}
.lc{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px}
.lc button{border:0;cursor:pointer;color:#fff;background:rgba(255,255,255,.18);width:56px;height:56px;border-radius:50%;font-size:22px}
.lc button.big{width:84px;height:84px;font-size:32px;background:rgba(255,255,255,.92);color:#222}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.preset{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:7px 10px;cursor:pointer;border:1px solid transparent;line-height:1.25}
.preset:hover{border-color:var(--acc)}
.preset b{font-size:13px}.preset small{color:var(--mut);font-size:11px}
.tin{width:90px;text-align:center;font-variant-numeric:tabular-nums}
.cfgbar{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px 0}.cfgbar.ind{margin-left:20px}
.cfgbar .stp{align-items:center}.cfgbar .stp small{font-size:9.5px;padding-left:0;text-align:center;white-space:nowrap}.cfgbar .stp div{height:26px}.cfgbar .stp button{width:19px;height:24px;font-size:14px}.cfgbar .stp span{min-width:26px;font-size:12px}
.stp{display:flex;flex-direction:column;align-items:center;gap:2px}
.stp small{font-size:9.5px;color:var(--mut);text-align:center;white-space:nowrap}
.stp div{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:20px;height:26px}
.stp button{width:19px;height:24px;border:0;background:none;color:var(--acc2);font:700 14px system-ui;cursor:pointer;border-radius:50%}
.stp span{min-width:26px;text-align:center;font:600 12px system-ui;color:var(--fg);padding:0 2px}
.rsel{padding:2px 6px;font-size:12px;border-radius:20px;background:#3a1517;color:#ffb3b5;border:0}
.alumno nav,.alumno #b-grupo{display:none!important}

</head>

<header>
  <div class="top"><h1>🥊 Clases de <span>Kick Boxing / Muay Thai</span></h1><span id="st" class="mut" style="font-size:12px"></span></div>
  <div style="max-width:860px;margin:0 auto;padding:0 12px 6px"><button id="b-grupo" class="btn sm" style="font-size:12px;padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 …</button></div>
  <nav>
    <button data-t="clase" class="on">Clase</button>
    <button data-t="timer">Timer</button>

    <button data-t="mat">Materiales</button>
    <button data-t="alum">Alumnos</button>
  </nav>
</header>
<main id="main"></main>

<div id="live">

  <div id="lv-name"></div>

  <div id="lv-next"></div>
  <div id="lv-par" style="display:none"></div>
  <button id="lv-rep" style="display:none;margin:8px auto 0;padding:9px 16px;font:800 14px system-ui;border-radius:12px;border:1px solid #fff6;background:#0003;color:#fff">🔁 Repetir ejercicio</button>
  <button id="lv-est" style="display:none;margin:8px auto 0;padding:14px 22px;font:800 18px system-ui;border-radius:14px;border:0;background:#2a9d8f;color:#fff">✓ Siguiente estación</button>
  <div id="lv-bar"><div></div></div>
  <div class="lc">
    <button id="lv-prev" aria-label="Anterior">⏮</button>
    <button id="lv-play" class="big" aria-label="Pausa">⏸</button>

    <button id="lv-close" aria-label="Cerrar">✕</button>
  </div>
</div>

function finLive() { live.run = false; setFase('end'); bell(3); $('#lv-ph').textContent = 'FIN'; $('#lv-round').textContent = ''; $('#lv-name').textContent = '¡Terminado! Buen trabajo.'; $('#lv-next').textContent = ''; $('#lv-time').textContent = '0:00'; $('#lv-tot').textContent = ''; live.anim = null; $('#lv-svg').style.display = 'none'; hablar('Terminado. Buen trabajo.'); clearInterval(live.tick); updPlay(); if (live.esClase && S.draft && !S.draft._saved) guardarClase();  if (S.difMode) marcarDifHecha(); }
function cerrarLive() { live.on = false; live.run = false; clearInterval(live.tick); $('#live').className = ''; try { tts?.stop().catch(() => {}); speechSynthesis?.cancel(); } catch (e) {} try { live.wl?.release(); } catch (e) {} if (S.edPlan) { cerrarPlan(); return; } if (S.draft?.tiempos) render(); }

/* ================= TIMER DE ROUNDS ================= */
const PRESETS = [
  { id: 'box', n: 'Boxeo clásico', w: 180, r: 60, R: 12 },
  { id: 'mt', n: 'Muay Thai', w: 180, r: 120, R: 5 },
  { id: 'kb', n: 'Kick boxing amateur', w: 120, r: 60, R: 3 },
  { id: 'gua', n: 'Guanteo', w: 120, r: 30, R: 6 },
  { id: 'bol', n: 'Bolsa intensa', w: 60, r: 30, R: 10 },
  { id: 'tab', n: 'Tabata', w: 20, r: 10, R: 8 },
];
let TC = { w: 180, r: 60, R: 6, p: 10 };
try { Object.assign(TC, JSON.parse(localStorage.getItem('kb_timer') || '{}')); } catch (e) {}
const toS = v => { const m = String(v).trim().match(/^(\d+)(?::(\d{1,2}))?$/); if (!m) return null; return m[2] !== undefined ? +m[1] * 60 + +m[2] : +m[1]; };
function segsTimer(n, w, r, R, p) {
  const T = [{ f: 'prep', s: p, n: 'Preparados', blk: n, say: `${n}. ${R} rounds. Preparados.` }];
  for (let i = 1; i <= R; i++) { T.push({ f: 'work', s: w, n: `Round ${i}`, blk: n, sub: `Ronda ${i}/${R}`, combo: TC.combo ? TC.combo : null }); if (i < R && r > 0) T.push({ f: 'rest', s: r, n: 'Descanso', blk: n }); }
  T.forEach((s, i) => { s.next = T.slice(i + 1).find(x => x.f === 'work'); });
  return T;
}
function iniciarTimer(n, w, r, R, p = TC.p) { abrirLive(segsTimer(n, w, r, R, p), n, `Trabajo ${mmss(w)} · Descanso ${mmss(r)}`); }
function vTimer() {
  const tot = s => mmss(s.R * s.w + (s.R - 1) * s.r);
  const nav = vocesNav();
  const vozCard = `<div class="card"><h3 style="margin:0 0 10px">🔊 Voz</h3><div class="row" style="align-items:flex-end;gap:8px;flex-wrap:wrap">
    <div><label>Voz</label><select id="vz-v">${!tts ? `<option value="buttery" ${!VOZ.v.startsWith('nav:') ? 'selected' : ''}>Predeterminada</option>` : ''}${tts ? `<optgroup label="Voces de Claude">${Object.entries(VOCES_C).map(([k, l]) => `<option value="${k}" ${VOZ.v === k ? 'selected' : ''}>${l}</option>`).join('')}</optgroup>` : ''}${nav.length ? `<optgroup label="Voces del dispositivo">${nav.map(v => `<option value="nav:${esc(v.name)}" ${VOZ.v === 'nav:' + v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</optgroup>` : ''}</select></div>
    <div class="stp"><small>Velocidad</small><div><button data-vr="-1" aria-label="Más lento">−</button><span>${VOZ.rate.toFixed(2).replace(/0$/, '')}x</span><button data-vr="1" aria-label="Más rápido">+</button></div></div>
    <button class="btn" id="vz-t">▶ Probar</button></div>
    ${!tts && !('speechSynthesis' in window) ? `<div class="warn" style="margin-top:8px">Este navegador no tiene voz. Abrí la app en <b>Chrome</b> (Android) o <b>Safari</b> (iPhone) en lugar de dentro de la app de Claude.</div>` : !tts ? `<div class="note" style="margin-top:6px">Si no escuchás nada: subí el volumen multimedia, sacá el modo silencio y probá abrir la app en Chrome o Safari.</div>` : ''}</div>`;
  return vozCard + `<div class="card"><h3 style="margin:0 0 10px">Timer de rounds</h3>
    <div class="presets">${PRESETS.map(p => `<div class="preset" data-pre="${p.id}"><div><b>${p.n}</b><br><small>${mmss(p.w)} / ${mmss(p.r)} · ${p.R} rounds</small></div><span style="font-size:14px">▶</span></div>`).join('')}</div></div>
    <div class="card"><h3 style="margin:0 0 10px">Personalizado</h3><div class="row">
      <div><label>Trabajo (m:ss)</label><input class="tin" id="tc-w" value="${mmss(TC.w)}"></div>
      <div><label>Descanso (m:ss)</label><input class="tin" id="tc-r" value="${mmss(TC.r)}"></div>
      <div><label>Rounds</label><input class="tin" id="tc-R" type="number" min="1" max="50" value="${TC.R}"></div>
      <div><label>Preparación (seg)</label><input class="tin" id="tc-p" type="number" min="0" max="60" value="${TC.p}"></div>
      <div><label>Cantar combinaciones</label><select id="tc-c"><option value="">No</option><option value="manos" ${TC.combo === 'manos' ? 'selected' : ''}>Solo manos</option><option value="todo" ${TC.combo === 'todo' ? 'selected' : ''}>Manos y piernas</option></select></div>
      <button class="btn pri" id="tc-go">▶ Iniciar</button></div>
      <div class="note">Campana al empezar y terminar cada round, aviso a los 10 segundos y pitidos al final del descanso. "Cantar combinaciones" también aplica a los presets.</div></div>`;
}
// toques rápidos en el modo clase (responde al apoyar el dedo, sin esperar el click)
function tapLive(sel, fn) { const el = $(sel); let t = 0; el.addEventListener('pointerdown', e => { e.preventDefault(); const n = Date.now(); if (n - t < 250) return; t = n; el.classList.add('tap'); setTimeout(() => el.classList.remove('tap'), 150); try { desbloquear(); } catch (x) {} fn(); }); el.addEventListener('click', e => e.preventDefault()); }
$('#lv-play').onclick = null; tapLive('#lv-play', () => { if (live.i >= live.segs.length) return; live.run = !live.run; if (live.run) startTick(); updPlay(); });
tapLive('#lv-est', () => { const s = live.segs[live.i]; if (s?.crono) { bell(1); if (live.i < live.segs.length - 1) { live.i++; iniciarSeg(); if (live.run) startTick(); } else finLive(); return; } sigEst(); }); tapLive('#lv-rep', () => { const s = live.segs[live.i]; if (!s) return;
  if (s.f === 'work') { live.left = s.s; live.say10 = false; live.warned = false; bell(1); hablar('Repetimos: ' + (s.a ? s.n : s.sub || '')); pintarT(); return; }
  let j = live.i - 1; while (j >= 0 && live.segs[j].f !== 'work') j--; if (j < 0) return; const w = { ...live.segs[j] }, r = { f: 'rest', s: Math.min(s.s, 30), n: 'Descanso', blk: w.blk };
  live.segs.splice(live.i + 1, 0, w, r); live.segs.forEach((x, k) => { x.next = live.segs.slice(k + 1).find(y => y.f === 'work'); });
  toast('Se repite: ' + w.n); hablar('Repetimos: ' + w.n); $('#lv-name').textContent = 'Sigue: ' + w.n; $('#lv-round').textContent = 'Repetición'; live.anim = w.a || live.anim; live.left = Math.min(live.left, 10); pintarT(); }); $('#lv-par').addEventListener('pointerdown', ev => { const b = ev.target.closest('[data-ppok],[data-ppun]'); if (!b) return; ev.preventDefault(); if (b.dataset.ppok) marcarPar(+b.dataset.ppok); else marcarPar(+b.dataset.ppun, true); }); $('#lv-nxt').onclick = null; tapLive('#lv-nxt', () => { if (live.i < live.segs.length - 1) { live.i++; iniciarSeg(); if (live.run) startTick(); } });
$('#lv-prev').onclick = null; tapLive('#lv-prev', () => { if (live.i > 0) { live.i--; iniciarSeg(); if (live.run) startTick(); } });
$('#lv-voice').onclick = () => { live.voice = !live.voice; $('#lv-voice').textContent = live.voice ? '🔊' : '🔇'; if (!live.voice) { try { tts?.stop().catch(() => {}); speechSynthesis?.cancel(); } catch (e) {} } };
$('#lv-close').onclick = null; tapLive('#lv-close', () => { if (live.big) { live.big = false; try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} } cerrarLive(); });
tapLive('#lv-big', () => { live.big = !live.big; live.ctl = false; try { if (live.big) document.documentElement.requestFullscreen?.().catch(() => {}); else if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} setFase(live.fase || 'prep'); });
// en pantalla grande, tocar la pantalla muestra/oculta los controles
$('#live').addEventListener('pointerdown', e => { if (!live.big || e.target.closest('.lc')) return; live.ctl = !live.ctl; setFase(live.fase); clearTimeout(live.ctlT); if (live.ctl) live.ctlT = setTimeout(() => { live.ctl = false; setFase(live.fase); }, 5000); });
$('#lv-combo').onclick = () => { live.comboOn = !live.comboOn; $('#lv-combo').style.opacity = live.comboOn ? 1 : .4; toast(live.comboOn ? 'Combinaciones activadas' : 'Combinaciones desactivadas'); };

/* ================= INICIO ================= */
render();
(async () => {
  try { tts = await claude.use('tts'); } catch (e) {}
  if (DIF_ID) { modoAlumno(); return; }
  let db = null; try { db = await claude.use('db'); } catch (e) {}
  const to = setTimeout(() => { if (!S.loaded.banco) toast('No se puede conectar con la base todavía…'); }, 10000);
  if (!db) { clearTimeout(to); S.loaded = { banco: true, mats: true, clases: true }; S.banco = []; S.mats = []; render(); toast('Iniciá sesión para usar la base de datos.'); return; }
  S.db = db;
  let us = null; try { us = await claude.use('user'); } catch (e) {}
  const esDueno = us ? await us.isOwner() : true; S.uid = us ? await us.id() : null; S.priv = !esDueno && !!S.uid;
  if (S.priv) toast('Perfil personal: tus ejercicios, materiales e historial son solo tuyos.');
  const err = e => { console.error(e); toast('Error leyendo datos.'); };
  db.doc('banco/ejercicios').onSnapshot(s => { clearTimeout(to); const d = s.exists ? s.data() : {}; S._bm = d.items || []; S._borr = [...(d.borrados || [])]; combinarBanco(); S.loaded.banco = true; render(); }, err);
  db.collection('extras').onSnapshot(s => { S._ex = s.docs.map(d => d.data()); combinarBanco(); render(); }, err);
  db.doc('banco/ajustes').onSnapshot(s => { S._aj = s.exists ? s.data() : { items: [], borrados: [] }; combinarBanco(); render(); }, err);
  db.doc('banco/extra').onSnapshot(s => { S._bx = s.exists ? (s.data().items || []) : []; combinarBanco(); render(); }, err);
  db.collection('plan').onSnapshot(s => { const hoy = new Date(); hoy.setHours(0, 0, 0, 0); S.plan = s.docs.map(d => ({ ...d.data(), _id: d.id })).filter(p => new Date(p.fecha) >= hoy).sort((x, y) => x.fecha.localeCompare(y.fecha)); render(); }, err);
  db.doc(S.priv ? P_('alumnos') : 'config/alumnos').onSnapshot(s => { S.alumnos = s.exists ? [...(s.data().lista || [])] : []; S.alDatos = s.exists ? JSON.parse(JSON.stringify(s.data().datos || {})) : {}; render(); }, err);
  db.doc(S.priv ? P_('evitar') : 'config/evitar').onSnapshot(s => { if (s.exists) { const d = s.data(); S.evitar = { zonas: [...(d.zonas || [])], grupos: [...(d.grupos || [])], ids: [...(d.ids || [])] }; } render(); }, err);
  const setMats = () => { const src = S._matsUser || S._matsShared || []; S.mats = src.map(x => ({ ...x })); S.loaded.mats = true;
    // una sola vez: bandas elásticas por color en el lugar principal
    try { if (!S.priv && S.mats.length && sedeAct().id === sedes()[0].id && !localStorage.getItem('kb_mig_bandas2')) { localStorage.setItem('kb_mig_bandas2', 1); if (!S.mats.some(m => m.g === 'bandas')) { S.mats = S.mats.filter(m => m.id !== 'bandas'); [['amarilla', 'Banda amarilla (la más fina)'], ['roja', 'Banda roja'], ['verde', 'Banda verde'], ['violeta', 'Banda violeta'], ['negra', 'Banda negra'], ['verde_ancha', 'Banda verde ancha (Tushka)']].forEach(([k, n]) => S.mats.push({ id: 'banda_' + k, n, g: 'bandas', on: true, c: 1 })); saveMats(); } } } catch (e) {}
    try { if (!S.priv && S.mats.length && sedeAct().id === sedes()[0].id && !localStorage.getItem('kb_mig_bandas')) { localStorage.setItem('kb_mig_bandas', 1); if (!S.mats.some(m => m.id === 'bandas' || /banda/i.test(m.n || ''))) { S.mats.push({ id: 'bandas', n: 'Bandas elásticas', on: true, c: 6 }); saveMats(); } } } catch (e) {}
    render(); };
  let unMats = null; S._subMats = () => { try { unMats && unMats(); } catch (e) {} const path = matsDoc(sedeAct().id); unMats = db.doc(path).onSnapshot(s => { S._matsShared = s.exists ? (s.data().items || []) : []; setMats(); }, err); };
  db.doc('config/sedes').onSnapshot(s => { const prev = S.sedes && sedeAct().id; S.sedes = s.exists ? JSON.parse(JSON.stringify(s.data().lista || [])) : null; if (!S._gIni) { S._gIni = 1; try { const [a, b2] = (localStorage.getItem('kb_grupo') || '').split('|'); if (a) { S.sede = a; S.hor = b2; } } catch (e) {} }
    if (!unMats || prev !== sedeAct().id) S._subMats(); render(); }, err);
  if (S.priv) { db.doc(P_('materiales')).onSnapshot(s => { S._matsUser = s.exists ? (s.data().items || []) : null; setMats(); }, err);
    db.doc(P_('banco')).onSnapshot(s => { const d = s.exists ? s.data() : {}; S._um = { mods: { ...(d.mods || {}) }, borrados: [...(d.borrados || [])] }; combinarBanco(); render(); }, err); }
  if (ES_FB && !S.priv) db.collection('difer').onSnapshot(s => { S.difs = s.docs.map(d => ({ ...d.data(), _id: d.id })); registrarDifHechas(); render(); }, () => {});
  clasesRef().orderBy('fecha', 'desc').limit(400).onSnapshot(s => { S.clases = s.docs.map(d => ({ ...d.data(), _id: d.id })); S.loaded.clases = true; if (S.tab !== 'clase' || !document.querySelector('.modal')) render(); }, err);
})();
</script>
